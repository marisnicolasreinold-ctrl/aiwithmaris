  const LISTEN = ['garten', 'haus']
  const IST_LISTE = (id) => LISTEN.indexOf(id) >= 0

  // Die Saat flach ausrollen. Flach, nicht verschachtelt: der Server
  // verschmilzt genau eine Ebene tief, also ist jeder Unterpunkt seine eigene
  // Einheit. Waeren die Kinder ein Feld im Elternpunkt, verlieren zwei
  // gleichzeitig angehaengte Unterpunkte einander.
  const SAAT_FLACH = {}
  LISTEN.forEach((liste) => {
    SAAT[liste].punkte.forEach((p, i) => {
      const { kinder, ...rest } = p
      SAAT_FLACH[p.id] = { ...rest, liste, eltern: null, pos: (i + 1) * 1000, saat: 1 }
      ;(kinder || []).forEach((k, j) => {
        SAAT_FLACH[k.id] = { ...k, liste, eltern: p.id, pos: (j + 1) * 1000, saat: 1 }
      })
    })
  })

  const MONAT = new Date().getMonth() + 1
  const saisonJetzt = (p) => Array.isArray(p.monate) && p.monate.indexOf(MONAT) >= 0

  // Reihenfolge: `pos` als Zahl, die Saat in Tausenderschritten. Einfuegen und
  // Verschieben setzen den Mittelwert der neuen Nachbarn — so schreibt ein
  // Handgriff genau einen Eintrag und klobbert nicht die Umbenennung des
  // anderen. Die Id entscheidet den Gleichstand: jsonb normalisiert die
  // Schluesselreihenfolge, auf Object.keys ist hier kein Verlass.
  const ordnePunkte = (a, b) =>
    (a.pos || 0) - (b.pos || 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)

  let punkteMemo = null
  const punkteNeu = () => { punkteMemo = null }

  function bauePunkte() {
    const zusammen = {}
    Object.keys(SAAT_FLACH).forEach((id) => { zusammen[id] = { ...SAAT_FLACH[id] } })

    const eigen = (stand.punkte && typeof stand.punkte === 'object') ? stand.punkte : {}
    Object.keys(eigen).forEach((id) => {
      const ab = eigen[id]
      if (!ab || typeof ab !== 'object') return
      zusammen[id] = zusammen[id] ? { ...zusammen[id], ...ab, id } : { eltern: null, ...ab, id }
    })

    // Nur zeigen, was einen Text hat, zu einer Liste gehoert und nicht begraben
    // ist. Damit ist die Seite gegen Felder gewappnet, die eine spaetere
    // Fassung hinzufuegt, und Graeber bleiben unsichtbar, ohne zu verschwinden.
    const lebt = {}
    Object.keys(zusammen).forEach((id) => {
      const p = zusammen[id]
      if (p.weg) return
      if (typeof p.t !== 'string' || !p.t.trim()) return
      if (!IST_LISTE(p.liste)) return
      lebt[id] = p
    })

    // Waisen und dritte Ebene weg: ein Kind, dessen Elternpunkt geloescht ist,
    // haengt sonst allein in der Liste — und ein Enkel wuerde beim Zeichnen
    // gar nicht auftauchen, aber in jeder Zaehlung mitlaufen.
    Object.keys(lebt).forEach((id) => {
      const p = lebt[id]
      if (!p.eltern) return
      const e = lebt[p.eltern]
      if (!e || e.eltern || e.liste !== p.liste) delete lebt[id]
    })
    return lebt
  }

  const allePunkte = () => (punkteMemo || (punkteMemo = bauePunkte()))
  const punktNachId = (id) => allePunkte()[id]

  // Themen gibt es nur, wo die Saat welche nennt (heute: ToDo Haus). Ein Punkt
  // ohne bekanntes Thema kommt unter "Weitere" — auch einer, den jemand
  // selbst angelegt hat, ohne ein Thema zu waehlen.
  const WEITERE = 'weitere'
  const themenVon = (liste) => (SAAT[liste] && SAAT[liste].themen) || []
  function themaVon(p) {
    if (p.eltern) return null
    const t = themenVon(p.liste)
    if (!t.length) return null
    return t.some((x) => x.id === p.thema) ? p.thema : WEITERE
  }
  function themaReihe(liste) {
    const t = themenVon(liste)
    return t.length ? t.map((x) => x.id).concat(WEITERE) : [null]
  }
  function themaName(liste, id) {
    if (id === WEITERE) return 'Weitere'
    const t = themenVon(liste).find((x) => x.id === id)
    return t ? t.name : ''
  }

  // Geschwister sind, was man mit ↑ ↓ gegeneinander tauscht: dieselben Eltern,
  // oder oben in derselben Liste UND im selben Thema. Sonst sprange ein Punkt
  // mit ↑ unsichtbar ueber eine Themengrenze.
  const geschwister = (p) => Object.values(allePunkte())
    .filter((q) => p.eltern
      ? q.eltern === p.eltern
      : (q.liste === p.liste && !q.eltern && themaVon(q) === themaVon(p)))
    .sort(ordnePunkte)

  // Baumordnung zum Zeichnen: Kopf, dann seine Kinder.
  function listePunkte(liste) {
    const alle = Object.values(allePunkte())
    const reihe = themaReihe(liste)
    const rang = (p) => reihe.indexOf(themaVon(p))
    const raus = []
    alle.filter((p) => p.liste === liste && !p.eltern)
      .sort((a, b) => rang(a) - rang(b) || ordnePunkte(a, b))
      .forEach((kopf) => {
        raus.push(kopf)
        alle.filter((p) => p.eltern === kopf.id).sort(ordnePunkte).forEach((k) => raus.push(k))
      })
    return raus
  }

  function listeBilanz(liste) {
    const menge = listePunkte(liste)
    const fertig = menge.filter((p) => status(p.id) === 'fertig').length
    return { gesamt: menge.length, fertig, anteil: menge.length ? fertig / menge.length : 0 }
  }

  const ortName = (a) =>
    RAUM_NACH_ID[a.raum] ? RAUM_NACH_ID[a.raum].name : (SAAT[a.liste] ? SAAT[a.liste].name : 'Liste')

  /* ---------------------------------------------------------------- Zustand */

  const leer = () => ({
    v: 1, status: {}, notizen: {}, einkauf: {}, entscheidungen: {},
    wer: {}, ist: {}, punkte: {}, namen: ['Steffi', 'Maris'], laufend: null,
    wohnzimmer: '', geaendert: 0,
  })

  function lies(text) {
    try {
      const roh = JSON.parse(text)
      if (!roh || typeof roh !== 'object' || roh.v !== 1) return null
      const zusammen = { ...leer(), ...roh }
      // Aeltere Staende kannten die Namen noch nicht; ein halbes Paar waere
      // schlimmer als gar keins.
      if (!Array.isArray(zusammen.namen) || zusammen.namen.length !== 2) zusammen.namen = leer().namen
      // Eine Sammlung, die keine ist, wuerde beim ersten Schreiben durchfallen.
      TIEF.forEach((k) => {
        if (!zusammen[k] || typeof zusammen[k] !== 'object' || Array.isArray(zusammen[k])) zusammen[k] = {}
      })
      return zusammen
    } catch (_) {
      return null
    }
  }

  function ausSpeicher() {
    try { return lies(localStorage.getItem(SPEICHER) || '') } catch (_) { return null }
  }

  const eingebettet = lies((document.getElementById('zustand') || {}).textContent || '')
  const lokal = ausSpeicher()
  let stand =
    eingebettet && lokal
      ? (lokal.geaendert || 0) > (eingebettet.geaendert || 0) ? lokal : eingebettet
      : eingebettet || lokal || leer()

  let blick = 'plan'
  let ansicht = 'alle'
  // Haelt eine Raum- oder eine Listen-Id: beide filtern die Plan-Ansicht gleich.
  let bereichFilter = null
  let ablaufRaum = 'sz'
  const offeneDetails = new Set()
  let rueckgaengig = null
  let meldungTimer = null
  let offenerWer = null
  const offeneFertige = new Set()
  // Welcher Punkt gerade umbenannt wird, und ob ein fremder Stand noch aufs
  // Zeichnen wartet, weil hier jemand tippt.
  let umbenennen = null
  let neuesKind = null
  let nachzeichnen = false

  /* ------------------------------------------------------------- Ableitungen */

  const aktiv = (a) => !a.wenn || stand.entscheidungen[a.wenn] === 'ja'
  const status = (id) => stand.status[id] || 'offen'
  const daIstEs = (mid) => !!stand.einkauf[mid]

  function blocker(a) {
    return (a.nach || []).map((id) => AUFGABE_NACH_ID[id]).filter((v) => v && aktiv(v) && status(v.id) !== 'fertig')
  }

  function fehltMaterial(a) {
    return (a.braucht || []).map((id) => MATERIAL_NACH_ID[id]).filter((m) => m && !daIstEs(m.id))
  }

  const istDran = (a) => aktiv(a) && status(a.id) !== 'fertig' && blocker(a).length === 0 && fehltMaterial(a).length === 0

  // Reihenfolge der Vorschlaege: was laeuft zuerst, dann kurze Aufgaben vor
  // langen — ein Erfolgserlebnis in zehn Minuten zieht besser als zwei Stunden
  // Kleiderschrank.
  function warteschlange() {
    return AUFGABEN.filter(istDran).sort((a, b) => {
      const la = status(a.id) === 'laeuft' ? 0 : 1
      const lb = status(b.id) === 'laeuft' ? 0 : 1
      if (la !== lb) return la - lb
      if (!!a.warten !== !!b.warten) return a.warten ? 1 : -1
      return (a.min || 0) - (b.min || 0)
    })
  }

  function zeit(min) {
    if (!min) return ''
    if (min >= 1440) return Math.round(min / 1440) + ' Tag' + (min >= 2880 ? 'e' : '')
    if (min < 60) return min + ' min'
    const h = Math.floor(min / 60)
    const r = min % 60
    return r ? h + ' h ' + String(r).padStart(2, '0') : h + ' h'
  }

  function uhrzeit(sek) {
    const s = Math.max(0, Math.floor(sek))
    const m = Math.floor(s / 60)
    if (m >= 60) return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
    return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
  }

  function bilanz(raumId) {
    const menge = AUFGABEN.filter((a) => a.raum === raumId && aktiv(a))
    const fertig = menge.filter((a) => status(a.id) === 'fertig')
    const restMin = menge.filter((a) => status(a.id) !== 'fertig' && !a.warten).reduce((s, a) => s + (a.min || 0), 0)
    const ruht = AUFGABEN.filter((a) => a.raum === raumId && !aktiv(a)).length
    return {
      gesamt: menge.length, fertig: fertig.length, restMin, ruht,
      dran: menge.filter(istDran).length,
      anteil: menge.length ? fertig.length / menge.length : 0,
    }
  }

  /* --------------------------------------------------------------- Uhrwerk */

  // Die laufende Uhr steht als Startzeitpunkt im Zustand, nicht als Zaehler:
  // so laeuft sie weiter, wenn der Tab zu ist, und ueberlebt einen Neuladen.
  function gelaufen(id) {
    const l = stand.laufend
    const gespeichert = stand.ist[id] || 0
    if (l && l.id === id) return gespeichert + (Date.now() - l.seit) / 1000
    return gespeichert
  }

  function starte(id) {
    if (stand.laufend && stand.laufend.id !== id) halte()
    if (stand.laufend && stand.laufend.id === id) return
    stand.laufend = { id, seit: Date.now() }
    if (status(id) === 'offen') stand.status[id] = 'laeuft'
    sichern()
  }

  function halte() {
    const l = stand.laufend
    if (!l) return
    stand.ist[l.id] = (stand.ist[l.id] || 0) + (Date.now() - l.seit) / 1000
    stand.laufend = null
    sichern()
  }

  /* ------------------------------------------------------------- Speichern */

  let api = null
  let timer = null
  let hinweisText = 'nur auf diesem Gerät'
  let artifactGeprueft = false
  let wolke = null          // { token, wer }
  let wolkeFehler = ''
  let holtGerade = false

  try { wolke = JSON.parse(localStorage.getItem(WOLKE) || 'null') } catch (_) { wolke = null }

  // Unter aiwithmaris.com liegt vor dieser Seite eine Anmeldung. Wer da durch
  // ist, hat damit schon ein Sitzungstoken fuer den geteilten Stand — es ist
  // dasselbe. Also hier uebernehmen, statt ein zweites Mal nach demselben
  // Passwort zu fragen. Liegt kein Cookie vor (Artifact, lokale Datei), bleibt
  // alles wie bisher.
  const GATE = 'aiwm_hh'
  const GATE_WER = 'aiwm_hh_wer'

  function ausCookie(name) {
    const treffer = document.cookie.split(';').map((t) => t.trim())
      .find((t) => t.startsWith(name + '='))
    if (!treffer) return ''
    const roh = treffer.slice(name.length + 1)
    try { return decodeURIComponent(roh) } catch (_) { return roh }
  }

  const vomGate = ausCookie(GATE)
  if (vomGate) {
    const werVomGate = ausCookie(GATE_WER) || (wolke && wolke.wer) || 'Steffi'
    if (!wolke || wolke.token !== vomGate || wolke.wer !== werVomGate) {
      wolke = { token: vomGate, wer: werVomGate }
      try { localStorage.setItem(WOLKE, JSON.stringify(wolke)) } catch (_) {}
    }
  }

  // Erst klaeren, ob die Seite als Artifact laeuft. Dort teilt sie sich ueber
  // ihre eigene Veroeffentlichung, und ein Aufruf nach draussen waere dort
  // ohnehin gesperrt — die Verbinden-Karte hat da nichts zu suchen.
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then((a) => {
      api = a
      artifactGeprueft = true
      if (a) hinweisText = 'für alle gespeichert'
      zeichne()
    }).catch(() => { artifactGeprueft = true; zeichne() })
  } else {
    artifactGeprueft = true
  }

  const teilbar = () => artifactGeprueft && !api

  async function ruf(funktion, koerper) {
    const antwort = await fetch(DB + '/rest/v1/rpc/' + funktion, {
      method: 'POST',
      headers: { apikey: DB_KEY, Authorization: 'Bearer ' + DB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(koerper),
    })
    if (!antwort.ok) throw new Error('HTTP ' + antwort.status)
    return antwort.json()
  }

  // Der letzte Stand, den der Server uns bestaetigt hat. Ohne ihn kann man
  // "was habe ich geaendert" nicht von "was ist hier nur veraltet"
  // unterscheiden.
  let fernStand = null

  const gleich = (a, b) => JSON.stringify(a) === JSON.stringify(b)

  const merkeFern = (daten) => {
    const o = {}
    TIEF.forEach((k) => { if (daten && daten[k] && typeof daten[k] === 'object') o[k] = daten[k] })
    fernStand = JSON.parse(JSON.stringify(o))
  }

  // Alle Eintraege, die dieses Geraet seit der letzten Antwort des Servers
  // geaendert hat.
  function eigeneAenderungen(k) {
    const meins = stand[k] || {}
    const bestaetigt = (fernStand && fernStand[k]) || {}
    const raus = {}
    Object.keys(meins).forEach((id) => {
      if (!gleich(meins[id], bestaetigt[id])) raus[id] = meins[id]
    })
    return raus
  }

  function zumSenden() {
    const o = {}
    GETEILT.forEach((k) => {
      if (stand[k] === undefined) return
      // Von den verschmolzenen Sammlungen nur das Geaenderte schicken. Schickte
      // man die ganze Abbildung, ueberschriebe jedes Speichern hier den Haken,
      // den der andere in den letzten Sekunden gesetzt hat — unsere Abbildung
      // ist dann ja die aeltere. Mit dem Ausschnitt wird das Verschmelzen
      // wirklich additiv, und ein Grabstein kann nicht auferstehen.
      o[k] = (fernStand && TIEF.indexOf(k) >= 0) ? eigeneAenderungen(k) : stand[k]
    })
    return o
  }

  function alsGanzes() {
    const o = {}
    GETEILT.forEach((k) => { if (stand[k] !== undefined) o[k] = stand[k] })
    return o
  }

  function uebernehmen(daten) {
    if (!daten) return false
    let etwasNeu = false
    GETEILT.forEach((k) => {
      if (daten[k] === undefined) return
      let wert = daten[k]
      if (fernStand && TIEF.indexOf(k) >= 0 && wert && typeof wert === 'object') {
        // Was hier noch auf seine Bestaetigung wartet, darf die Antwort nicht
        // zurueckdrehen — sonst springt ein gerade getippter Punkt wieder weg,
        // wenn der 15-Sekunden-Abgleich dazwischenkommt.
        const offen = eigeneAenderungen(k)
        if (Object.keys(offen).length) wert = { ...wert, ...offen }
      }
      if (!gleich(wert, stand[k])) etwasNeu = true
      stand[k] = wert
    })
    merkeFern(daten)
    punkteNeu()
    if (etwasNeu) {
      try { localStorage.setItem(SPEICHER, JSON.stringify(stand)) } catch (_) {}
    }
    return etwasNeu
  }

  async function anmelden(passwort, wer) {
    wolkeFehler = ''
    try {
      const token = await ruf('haushalt_anmelden', { u: 'haushalt', p: passwort, wer })
      if (!token) { wolkeFehler = 'Passwort stimmt nicht.'; return zeichne() }
      wolke = { token, wer }
      try { localStorage.setItem(WOLKE, JSON.stringify(wolke)) } catch (_) {}
      // Erst den fremden Stand holen, dann den eigenen dazulegen, damit beim
      // Verbinden nichts von der anderen Seite verloren geht.
      await holen()
      await schieben()
      hinweisText = 'geteilt mit ' + (wolke.wer === 'Steffi' ? 'Maris' : 'Steffi')
      zeichne()
      pushPruefen()
    } catch (e) {
      wolkeFehler = 'Keine Verbindung zur Datenbank.'
      zeichne()
    }
  }

  function abmelden() {
    wolke = null
    pushAn = false
    hinweisText = 'nur auf diesem Gerät'
    try { localStorage.removeItem(WOLKE) } catch (_) {}
    // Ohne das waere das Trennen folgenlos: der naechste Seitenaufruf liest das
    // Cookie des Gates und meldet wieder an.
    if (vomGate) {
      document.cookie = GATE + '=; Path=/haushalt; Max-Age=0; Secure; SameSite=Lax'
      document.cookie = GATE_WER + '=; Path=/haushalt; Max-Age=0; Secure; SameSite=Lax'
    }
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ art: 'abmelden' })
    }
    zeichne()
  }

  async function holen() {
    if (!wolke || holtGerade) return
    holtGerade = true
    try {
      const fern = await ruf('haushalt_lesen', { t: wolke.token })
      if (fern === null) { abmelden(); wolkeFehler = 'Die Sitzung gilt nicht mehr — bitte neu verbinden.'; return }
      if (uebernehmen(fern.daten)) zeichneSanft()
    } catch (_) {
      /* Funkloch: der naechste Durchlauf holt es nach */
    } finally {
      holtGerade = false
    }
  }

  /* -------------------------------------------------------------- Push */

  let swReg = null
  let pushAn = false
  let pushHinweis = ''

  const amHandy = () => /iPhone|iPad|iPod/.test(navigator.userAgent)
  const abgelegt = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true

  // Auf dem iPhone gibt es Push nur fuer die Fassung, die ueber Teilen ->
  // "Zum Home-Bildschirm" abgelegt wurde. Ein offener Tab bekommt keine,
  // egal in welchem Browser — die benutzen dort alle dieselbe Maschinerie.
  const pushMoeglich = () =>
    'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window &&
    (!amHandy() || abgelegt())

  function schluesselAlsBytes(b64) {
    const roh = atob(b64.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(b64.length / 4) * 4, '='))
    return Uint8Array.from(roh, (c) => c.charCodeAt(0))
  }

  async function swBereit() {
    if (swReg) return swReg
    if (!('serviceWorker' in navigator)) return null
    try {
      swReg = await navigator.serviceWorker.register('/haushalt-sw.js', { scope: '/haushalt' })
      return swReg
    } catch (_) {
      return null
    }
  }

  function sitzungAnSw() {
    if (!wolke || !navigator.serviceWorker || !navigator.serviceWorker.controller) return
    navigator.serviceWorker.controller.postMessage({ art: 'sitzung', token: wolke.token, wer: wolke.wer })
  }

  async function pushEinschalten() {
    pushHinweis = ''
    if (!wolke) { pushHinweis = 'Erst verbinden.'; return zeichne() }
    try {
      const erlaubnis = await Notification.requestPermission()
      if (erlaubnis !== 'granted') {
        pushHinweis = 'Der Browser hat Benachrichtigungen abgelehnt. In den Einstellungen der Seite freigeben.'
        return zeichne()
      }
      const reg = await swBereit()
      if (!reg) { pushHinweis = 'Der Service Worker liess sich nicht anmelden.'; return zeichne() }
      await navigator.serviceWorker.ready

      const abo = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: schluesselAlsBytes(VAPID),
      })
      const j = abo.toJSON()
      const gut = await ruf('haushalt_push_anmelden', {
        t: wolke.token, endpunkt: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
      })
      if (!gut) { pushHinweis = 'Die Anmeldung wurde abgelehnt — bitte neu verbinden.'; return zeichne() }
      pushAn = true
      sitzungAnSw()
      zeichne()
    } catch (e) {
      pushHinweis = 'Hat nicht geklappt: ' + (e && e.message ? e.message : 'unbekannter Fehler')
      zeichne()
    }
  }

  async function pushAusschalten() {
    try {
      const reg = await swBereit()
      const abo = reg && (await reg.pushManager.getSubscription())
      if (abo) {
        if (wolke) await ruf('haushalt_push_abmelden', { t: wolke.token, endpunkt: abo.endpoint }).catch(() => {})
        await abo.unsubscribe()
      }
    } catch (_) { /* dann bleibt es beim Serverstand */ }
    pushAn = false
    zeichne()
  }

  async function pushPruefen() {
    if (!pushMoeglich() || !wolke) return
    try {
      const reg = await swBereit()
      if (!reg) return
      const abo = await reg.pushManager.getSubscription()
      pushAn = !!abo && Notification.permission === 'granted'
      if (pushAn) sitzungAnSw()
      zeichne()
    } catch (_) { /* egal */ }
  }

  // Eine Zuteilung ist das Einzige, was den anderen wirklich betrifft — also
  // das Einzige, wofuer ein Handy klingelt.
  async function meldeZuteilung(aufgabe, anPerson) {
    if (!wolke || anPerson == null) return
    const anName = stand.namen[anPerson]
    if (anName === wolke.wer) return    // sich selbst weckt man nicht
    stand.meldung = {
      titel: wolke.wer + ' hat dir etwas zugeteilt',
      text: aufgabe.t + ' · ' + ortName(aufgabe),
      an: anName,
      von: wolke.wer,
      zeit: Date.now(),
    }
    sichern()
    await schieben()
    try {
      await fetch(DB + '/functions/v1/haushalt-push', {
        method: 'POST',
        headers: { apikey: DB_KEY, Authorization: 'Bearer ' + DB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: wolke.token }),
      })
    } catch (_) {
      /* Die Meldung steht im geteilten Stand; sie kommt spaetestens beim
         naechsten Oeffnen an, auch wenn der Push nicht rausging. */
    }
  }

  async function schieben() {
    if (!wolke) return
    try {
      const fern = await ruf('haushalt_speichern', { t: wolke.token, daten: zumSenden(), wer: wolke.wer })
      if (fern === null) { abmelden(); return }
      // Die Antwort ist der verschmolzene Stand — damit kommt an, was der
      // andere in der Zwischenzeit geaendert hat.
      if (uebernehmen(fern.daten)) zeichneSanft()
    } catch (_) {
      /* offline: localStorage haelt den Stand, der naechste Versuch schiebt nach */
    }
  }

  // Der Gegensatz zum Verschmelzen, und die einzige Stelle, an der etwas
  // verschwinden kann. "Alles zuruecksetzen" braucht das: verschmelzend behielt
  // der Server jeden Haken, und das naechste Lesen holte sie alle zurueck.
  async function ersetzenFern() {
    if (!wolke) return
    try {
      const fern = await ruf('haushalt_ersetzen', { t: wolke.token, daten: alsGanzes(), wer: wolke.wer })
      if (fern === null) { abmelden(); return }
      merkeFern(fern.daten)
    } catch (_) {
      /* offline: der naechste Versuch schiebt verschmelzend nach, dann stehen
         die alten Haken wieder da — besser als ein stiller Verlust. */
    }
  }

  function neueFassung(daten) {
    const marke = 'id="zustand"'
    const i = QUELLE.indexOf(marke)
    if (i < 0) return null
    const auf = QUELLE.indexOf('>', i)
    const zu = QUELLE.indexOf('<\/script>', auf)
    if (auf < 0 || zu < 0) return null
    const json = JSON.stringify(daten).replace(/</g, '\\u003c')
    return QUELLE.slice(0, auf + 1) + json + QUELLE.slice(zu)
  }

  function sichern() {
    stand.geaendert = Date.now()
    punkteNeu()
    try { localStorage.setItem(SPEICHER, JSON.stringify(stand)) } catch (_) {}
    zeigeStand()
    clearTimeout(timer)
    timer = setTimeout(teilen, 2000)
  }

  async function teilen() {
    if (wolke) return schieben()
    if (!api) return
    const html = neueFassung(stand)
    if (!html) return
    try {
      await api.publish(html)
    } catch (e) {
      if (e && e.code === 'conflict') return
      api = null
      hinweisText = 'nur auf diesem Gerät'
      zeigeStand()
    }
  }

  // Der andere Stand kommt nicht von selbst — also regelmaessig nachsehen,
  // solange die Seite sichtbar ist, und sofort beim Zurueckwechseln.
  setInterval(() => { if (wolke && document.visibilityState === 'visible') holen() }, 15000)
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') holen() })
  if (wolke) {
    hinweisText = 'geteilt mit ' + (wolke.wer === 'Steffi' ? 'Maris' : 'Steffi')
    holen()
    pushPruefen()
  }

  function zeigeStand() {
    const el = document.getElementById('speicherstand')
    if (!el) return
    const wann = stand.geaendert ? new Date(stand.geaendert) : null
    el.textContent = wann
      ? hinweisText + ' · ' + wann.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
        wann.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
      : hinweisText
  }

  /* ------------------------------------------------------------------ HTML */

  const esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  const HAKEN = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 8 14.5 16 6"/></svg>'
  const LAEUFT = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7h-7z"/></svg>'
  const PFEIL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>'

  function ring(anteil, farbe) {
    const r = 19
    const u = 2 * Math.PI * r
    return `<svg class="ring" viewBox="0 0 46 46" style="--kante:${farbe}" aria-hidden="true">
      <circle class="spur" cx="23" cy="23" r="${r}"></circle>
      <circle class="weg" cx="23" cy="23" r="${r}" stroke-dasharray="${u.toFixed(1)}"
              stroke-dashoffset="${(u * (1 - anteil)).toFixed(1)}" transform="rotate(-90 23 23)"></circle>
      <text x="23" y="24">${Math.round(anteil * 100)}</text>
    </svg>`
  }

  /* ------------------------------------------------------------ Kopfbereich */

  function zeichneKopf() {
    const gesamt = RAEUME.reduce((s, r) => {
      const b = bilanz(r.id)
      s.gesamt += b.gesamt; s.fertig += b.fertig; s.rest += b.restMin; s.dran += b.dran
      return s
    }, { gesamt: 0, fertig: 0, rest: 0, dran: 0 })

    const pGesamt = LISTEN.reduce((n, l) => n + listeBilanz(l).gesamt, 0)
    const pFertig = LISTEN.reduce((n, l) => n + listeBilanz(l).fertig, 0)

    document.getElementById('unterzeile').textContent =
      (gesamt.fertig === gesamt.gesamt
        ? 'Schlafzimmer und Bad sind durch.'
        : `${gesamt.gesamt - gesamt.fertig} von ${gesamt.gesamt} Aufgaben in den Räumen offen, ungefähr ${zeit(gesamt.rest)} Arbeit. ` +
          `${gesamt.dran} davon könnt ihr sofort anfangen — der Rest wartet auf etwas anderes.`) +
      (pGesamt
        ? pFertig === pGesamt
          ? ' Garten und Haus sind abgearbeitet.'
          : ` In den Listen stehen noch ${pGesamt - pFertig} von ${pGesamt} Punkten.`
        : '')

    document.querySelectorAll('#reiter button').forEach((b) => {
      b.setAttribute('aria-selected', String(b.dataset.blick === blick))
    })

    const n0 = document.getElementById('name-0')
    const n1 = document.getElementById('name-1')
    if (n0 && document.activeElement !== n0) n0.value = stand.namen[0]
    if (n1 && document.activeElement !== n1) n1.value = stand.namen[1]
  }

  function zeichneUebersicht() {
    const kacheln = RAEUME.map((raum) => {
      const b = bilanz(raum.id)
      return `
        <button class="kachel" type="button" data-bereich="${raum.id}" aria-pressed="${bereichFilter === raum.id}" style="--kante:${raum.farbe}">
          ${ring(b.anteil, raum.farbe)}
          <span class="kachel-text">
            <span class="kachel-name">${esc(raum.name)}</span>
            <span class="kachel-zahl">${b.fertig} / ${b.gesamt}</span>
            <span class="kachel-fuss">${b.restMin ? 'noch ≈ ' + zeit(b.restMin) : 'alles erledigt'}${b.dran ? ' · ' + b.dran + ' dran' : ''}</span>
          </span>
        </button>`
    })

    const listen = LISTEN.map((liste) => {
      const b = listeBilanz(liste)
      const angabe = SAAT[liste]
      return `
        <button class="kachel" type="button" data-bereich="${liste}" aria-pressed="${bereichFilter === liste}" style="--kante:${angabe.farbe}">
          ${ring(b.anteil, angabe.farbe)}
          <span class="kachel-text">
            <span class="kachel-name">${esc(angabe.name)}</span>
            <span class="kachel-zahl">${b.fertig} / ${b.gesamt}</span>
            <span class="kachel-fuss">${b.gesamt - b.fertig ? (b.gesamt - b.fertig) + ' offen' : 'alles erledigt'}</span>
          </span>
        </button>`
    })

    const wz = `
      <div class="kachel" style="--kante:var(--raum-wz)">
        ${ring(0, 'var(--raum-wz)')}
        <span class="kachel-text">
          <span class="kachel-name">Wohnzimmer</span>
          <span class="kachel-zahl">–</span>
          <span class="kachel-fuss">kommt später</span>
        </span>
      </div>`

    return `<div class="uebersicht">${kacheln.join('')}${listen.join('')}${wz}</div>`
  }

  /* ------------------------------------------------------------ Plan-Ansicht */

  const bereichName = (id) =>
    RAUM_NACH_ID[id] ? RAUM_NACH_ID[id].name : (SAAT[id] ? SAAT[id].name : id)

  function zeichneFilter() {
    // Zeilen sind Aufgaben und Punkte zusammen. "Jetzt dran" bleibt bei den
    // Aufgaben: Punkte haben keine Vorgaenger, sie waeren alle dran.
    const zeilen = AUFGABEN.filter(aktiv).concat(LISTEN.map(listePunkte).flat())
    const zaehle = (pruefe) => zeilen.filter(pruefe).length
    const knoepfe = [
      { id: 'alle', name: 'Alles', n: zeilen.length },
      { id: 'offen', name: 'Offen', n: zaehle((a) => status(a.id) !== 'fertig') },
      { id: 'dran', name: 'Jetzt dran', n: AUFGABEN.filter((a) => aktiv(a) && istDran(a)).length },
      { id: 'fertig', name: 'Erledigt', n: zaehle((a) => status(a.id) === 'fertig') },
    ]
    const meins = stand.namen.map((name, i) => ({
      id: 'p' + i, name: esc(name), n: zaehle((a) => stand.wer[a.id] === i && status(a.id) !== 'fertig'),
    }))
    return `<div class="filter">` +
      knoepfe.concat(meins).map((k) =>
        `<button class="chip" type="button" data-ansicht="${k.id}" aria-pressed="${ansicht === k.id}">${k.name} <span class="chip-zahl">${k.n}</span></button>`,
      ).join('') +
      (bereichFilter
        ? `<button class="chip" type="button" data-bereich="${bereichFilter}" aria-pressed="true">nur ${esc(bereichName(bereichFilter))} ✕</button>`
        : '') +
      `</div>`
  }

  function passt(a) {
    if (bereichFilter && a.raum !== bereichFilter) return false
    if (ansicht === 'offen') return status(a.id) !== 'fertig'
    if (ansicht === 'fertig') return status(a.id) === 'fertig'
    if (ansicht === 'dran') return istDran(a)
    if (ansicht === 'p0') return stand.wer[a.id] === 0
    if (ansicht === 'p1') return stand.wer[a.id] === 1
    return true
  }

  function zeichneAufgabe(a) {
    const s = status(a.id)
    const ruht = !aktiv(a)
    const bl = ruht ? [] : blocker(a)
    const fehlt = ruht ? [] : fehltMaterial(a)
    const auf = offeneDetails.has(a.id)
    const wer = stand.wer[a.id]
    const lauf = stand.laufend && stand.laufend.id === a.id

    const marker = []
    if (a.min) marker.push(`<span class="tag${a.warten ? ' warten' : ''}">${a.warten ? 'wartet ' : ''}${zeit(a.min)}</span>`)
    if (stand.ist[a.id] || lauf) marker.push(`<span class="tag ist">gebraucht ${uhrzeit(gelaufen(a.id))}</span>`)
    if (a.dazu) marker.push('<span class="tag dazu">dazu</span>')
    if (ruht) marker.push('<span class="tag blocker">Entscheidung offen</span>')
    bl.slice(0, 2).forEach((v) => marker.push(`<span class="tag blocker">erst: ${esc(v.t.split(':')[0])}</span>`))
    if (bl.length > 2) marker.push(`<span class="tag blocker">+${bl.length - 2} weitere</span>`)
    fehlt.forEach((m) => marker.push(`<span class="tag einkauf">fehlt: ${esc(m.name.split(',')[0])}</span>`))
    if (!ruht && s === 'offen' && !bl.length && !fehlt.length) marker.push('<span class="tag dran">kann losgehen</span>')

    const klassen = ['zeile']
    if (s === 'fertig') klassen.push('fertig')
    if (bl.length || fehlt.length) klassen.push('blockiert')
    if (ruht) klassen.push('ruht')
    if (auf) klassen.push('offen-detail')
    if (lauf) klassen.push('imfokus')

    const detail = auf
      ? `<div class="detail">
           ${a.text ? `<p>${esc(a.text)}</p>` : ''}
           ${(a.braucht || []).length
             ? `<ul class="liste">${a.braucht.map((id) => MATERIAL_NACH_ID[id]).filter(Boolean)
                 .map((m) => `<li>${esc(m.name)}${daIstEs(m.id) ? ' — da' : ' — fehlt noch'}</li>`).join('')}</ul>`
             : ''}
           <textarea class="notiz" data-notiz="${a.id}" placeholder="Notiz, Maß, Farbnummer …">${esc(stand.notizen[a.id] || '')}</textarea>
           ${istDran(a) ? `<div class="detail-knoepfe"><button class="knopf klein stark" type="button" data-losgehen="${a.id}">Jetzt machen</button></div>` : ''}
         </div>`
      : ''

    return `
      <div class="${klassen.join(' ')}">
        <div class="zeile-kopf">
          <button class="status" type="button" data-status="${a.id}" data-s="${s}"
                  aria-pressed="${s === 'fertig'}"
                  aria-label="${esc(a.t)}${s === 'fertig' ? ' — erledigt, zum Zurücknehmen tippen' : ' — als erledigt abhaken'}"
                  >${s === 'fertig' ? HAKEN : lauf ? LAEUFT : ''}</button>
          <div class="zeile-mitte">
            <button class="titel" type="button" data-detail="${a.id}" aria-expanded="${auf}">${esc(a.t)}</button>
            ${marker.length ? `<div class="marker">${marker.join('')}</div>` : ''}
          </div>
          <button class="wer" type="button" data-wer="${a.id}" ${wer === 0 || wer === 1 ? `data-p="${wer}"` : ''}
                  aria-expanded="${offenerWer === a.id}"
                  aria-label="Zuständig für ${esc(a.t)}: ${wer === 0 || wer === 1 ? esc(stand.namen[wer]) : 'niemand'}"
                  title="${wer === 0 || wer === 1 ? esc(stand.namen[wer]) : 'niemand zugeteilt'}">${wer === 0 || wer === 1 ? esc(stand.namen[wer].slice(0, 2)) : '+'}</button>
          <button class="aufklapp" type="button" data-detail="${a.id}" aria-label="Details zu ${esc(a.t)}" aria-expanded="${auf}">${PFEIL}</button>
        </div>
        ${offenerWer === a.id ? `
          <div class="wer-wahl">
            <span class="wer-frage">Wer macht das?</span>
            ${stand.namen.map((name, i) => `
              <button class="chip" type="button" data-wer-wahl="${a.id}" data-person="${i}"
                      aria-pressed="${wer === i}">${esc(name)}</button>`).join('')}
            <button class="chip" type="button" data-wer-wahl="${a.id}" data-person="keiner"
                    aria-pressed="${wer !== 0 && wer !== 1}">niemand</button>
          </div>` : ''}
        ${detail}
      </div>`
  }

  function zeichneRaum(raum) {
    const b = bilanz(raum.id)
    const teile = []

    // Erledigtes verschwindet hinter einer Zeile, statt die Liste zu fluten.
    // Beim Filter "Erledigt" waere das Zuklappen albern, dort bleibt alles offen.
    const fertigeZeigen = ansicht === 'fertig' || offeneFertige.has(raum.id)
    let versteckt = 0

    raum.phasen.forEach((phase) => {
      let sichtbar = phase.aufgaben.filter(passt)
      if (!fertigeZeigen) {
        const vorher = sichtbar.length
        sichtbar = sichtbar.filter((a) => status(a.id) !== 'fertig')
        versteckt += vorher - sichtbar.length
      }
      if (!sichtbar.length) return
      teile.push(`<div class="phase"><span>${esc(phase.name)}</span>${phase.hinweis ? `<em>${esc(phase.hinweis)}</em>` : ''}</div>`)
      sichtbar.forEach((a) => teile.push(zeichneAufgabe(a)))
    })

    if (versteckt || (fertigeZeigen && b.fertig && ansicht !== 'fertig')) {
      teile.push(`<button class="ausklapp" type="button" data-fertige="${raum.id}" aria-expanded="${fertigeZeigen}">
        ${fertigeZeigen ? 'Erledigte wieder ausblenden' : `${versteckt} Erledigte${versteckt === 1 ? 's' : ''} einblenden`}
      </button>`)
    }

    const e = raum.entscheidung
    const gewaehlt = e ? stand.entscheidungen[e.id] || 'offen' : null
    const entscheidung = e
      ? `<div class="entscheidung${gewaehlt !== 'offen' ? ' erledigt' : ''}">
           <div>
             <strong>${esc(e.frage)}</strong>
             <div class="warum">${esc(e.text)}</div>
           </div>
           <div class="wahl">
             ${['ja', 'nein', 'später'].map((w) =>
               `<button class="chip" type="button" data-entscheidung="${e.id}" data-wahl="${w}" aria-pressed="${gewaehlt === w}">${w}</button>`).join('')}
           </div>
         </div>`
      : ''

    return `
      <section class="karte" style="--kante:${raum.farbe}">
        <div class="karte-kopf">
          <h2>${esc(raum.name)}</h2>
          <span class="meta">${b.fertig}/${b.gesamt} erledigt${b.restMin ? ' · noch ≈ ' + zeit(b.restMin) : ''}${b.ruht ? ' · ' + b.ruht + ' ruhen' : ''}</span>
        </div>
        ${entscheidung}
        ${teile.length ? teile.join('') : '<div class="leer">In dieser Ansicht ist hier gerade nichts.</div>'}
      </section>`
  }


  /* ------------------------------------------------------- Listen zeichnen */

  // Punkte benutzen dieselbe Zeile wie Aufgaben — dieselben Klassen, dasselbe
  // Kaestchen, dieselbe Personenwahl. Neu ist nur, was Aufgaben nicht haben:
  // eine zweite Ebene, das Saison-Etikett und die Werkzeuge zum Aendern. Die
  // Werkzeuge stehen im Detail, nicht in der Zeile: bei 93 Punkten muss die
  // Liste lesbar bleiben, und im Detail ist Platz fuer Tippziele von 44 px.
  function zeichnePunkt(p, geschwisterZahl, platz) {
    const s = status(p.id)
    const auf = offeneDetails.has(p.id)
    const wer = stand.wer[p.id]
    const kindZahl = p.eltern ? 0 : Object.values(allePunkte()).filter((q) => q.eltern === p.id).length

    const marker = []
    if (p.saison) marker.push(`<span class="tag saison${saisonJetzt(p) ? ' jetzt' : ''}">${esc(p.saison)}</span>`)
    if (p.sperre) marker.push(`<span class="tag sperre">${esc(p.sperre)}</span>`)
    if (p.zeigt) marker.push('<span class="tag dazu">gibt es schon</span>')
    if (kindZahl && !auf) {
      const offen = Object.values(allePunkte())
        .filter((q) => q.eltern === p.id && status(q.id) !== 'fertig').length
      marker.push(`<span class="tag">${kindZahl - offen}/${kindZahl} Unterpunkte</span>`)
    }

    const klassen = ['zeile']
    if (s === 'fertig') klassen.push('fertig')
    if (p.eltern) klassen.push('kind')
    if (auf) klassen.push('offen-detail')

    const werkzeug = umbenennen === p.id
      ? `<form class="p-form" data-umbenennen="${p.id}">
           <input class="p-feld" name="text" value="${esc(p.t)}" maxlength="200" aria-label="Neuer Text für ${esc(p.t)}">
           <button class="p-knopf" type="submit">Übernehmen</button>
           <button class="p-knopf" type="button" data-umbenennen-ab="1">Abbrechen</button>
         </form>`
      : `<div class="punkt-werkzeug">
           <button class="p-knopf" type="button" data-p-name="${p.id}">Umbenennen</button>
           <button class="p-knopf" type="button" data-p-auf="${p.id}" aria-label="${esc(p.t)} nach oben"
                   ${platz === 0 ? 'disabled' : ''}>↑</button>
           <button class="p-knopf" type="button" data-p-ab="${p.id}" aria-label="${esc(p.t)} nach unten"
                   ${platz === geschwisterZahl - 1 ? 'disabled' : ''}>↓</button>
           ${p.eltern ? '' : `<button class="p-knopf" type="button" data-p-kind="${p.id}">+ Unterpunkt</button>`}
           <button class="p-knopf weg" type="button" data-p-weg="${p.id}">Löschen</button>
           ${!p.eltern && themenVon(p.liste).length ? `
             <select class="p-feld p-thema" data-p-thema="${p.id}" aria-label="Thema für ${esc(p.t)}">
               ${themaReihe(p.liste).map((t) => `<option value="${t}"${t === themaVon(p) ? ' selected' : ''}>Thema: ${esc(themaName(p.liste, t))}</option>`).join('')}
             </select>` : ''}
         </div>`

    const verweis = p.zeigt
      ? `<p>${esc(p.zeigt.text)}</p>` + (p.zeigt.ziel
          ? `<a class="p-verweis" href="${esc(p.zeigt.ziel)}">${esc(p.zeigt.wie)} →</a>`
          : `<div class="detail-knoepfe"><button class="knopf klein" type="button" data-bereich="${esc(p.zeigt.bereich)}">${esc(p.zeigt.wie)}</button></div>`)
      : ''

    const detail = auf
      ? `<div class="detail">
           ${p.warum ? `<p>${esc(p.warum)}</p>` : ''}
           ${verweis}
           <textarea class="notiz" data-notiz="${p.id}" placeholder="Notiz, Maß, Farbnummer …">${esc(stand.notizen[p.id] || '')}</textarea>
           ${werkzeug}
           ${neuesKind === p.id ? `
             <form class="p-form" data-anlegen-kind="${p.id}">
               <input class="p-feld" name="text" maxlength="200" placeholder="Unterpunkt zu „${esc(p.t)}“ …"
                      aria-label="Neuer Unterpunkt zu ${esc(p.t)}">
               <button class="p-knopf" type="submit">Hinzufügen</button>
             </form>` : ''}
         </div>`
      : ''

    return `
      <div class="${klassen.join(' ')}">
        <div class="zeile-kopf">
          <button class="status" type="button" data-status="${p.id}" data-s="${s}"
                  aria-pressed="${s === 'fertig'}"
                  aria-label="${esc(p.t)}${s === 'fertig' ? ' — erledigt, zum Zurücknehmen tippen' : ' — als erledigt abhaken'}"
                  >${s === 'fertig' ? HAKEN : ''}</button>
          <div class="zeile-mitte">
            <button class="titel" type="button" data-detail="${p.id}" aria-expanded="${auf}">${esc(p.t)}</button>
            ${marker.length ? `<div class="marker">${marker.join('')}</div>` : ''}
          </div>
          <button class="wer" type="button" data-wer="${p.id}" ${wer === 0 || wer === 1 ? `data-p="${wer}"` : ''}
                  aria-expanded="${offenerWer === p.id}"
                  aria-label="Zuständig für ${esc(p.t)}: ${wer === 0 || wer === 1 ? esc(stand.namen[wer]) : 'niemand'}"
                  title="${wer === 0 || wer === 1 ? esc(stand.namen[wer]) : 'niemand zugeteilt'}">${wer === 0 || wer === 1 ? esc(stand.namen[wer].slice(0, 2)) : '+'}</button>
          <button class="aufklapp" type="button" data-detail="${p.id}" aria-label="Details zu ${esc(p.t)}" aria-expanded="${auf}">${PFEIL}</button>
        </div>
        ${offenerWer === p.id ? `
          <div class="wer-wahl">
            <span class="wer-frage">Wer macht das?</span>
            ${stand.namen.map((name, i) => `
              <button class="chip" type="button" data-wer-wahl="${p.id}" data-person="${i}"
                      aria-pressed="${wer === i}">${esc(name)}</button>`).join('')}
            <button class="chip" type="button" data-wer-wahl="${p.id}" data-person="keiner"
                    aria-pressed="${wer !== 0 && wer !== 1}">niemand</button>
          </div>` : ''}
        ${detail}
      </div>`
  }

  function passtPunkt(p) {
    if (ansicht === 'offen') return status(p.id) !== 'fertig'
    if (ansicht === 'fertig') return status(p.id) === 'fertig'
    if (ansicht === 'p0') return stand.wer[p.id] === 0
    if (ansicht === 'p1') return stand.wer[p.id] === 1
    return true
  }

  function zeichneListe(liste) {
    const angabe = SAAT[liste]
    const b = listeBilanz(liste)
    const alle = listePunkte(liste)

    const fertigeZeigen = ansicht === 'fertig' || offeneFertige.has(liste)
    let versteckt = 0

    // Erst je Punkt entscheiden, dann die Koepfe nachziehen: ein Unterpunkt
    // ohne seinen Kopf haengt sonst ohne Zusammenhang in der Liste.
    const zeigen = new Set()
    alle.forEach((p) => {
      let ja = passtPunkt(p)
      if (ja && !fertigeZeigen && status(p.id) === 'fertig') { ja = false; versteckt += 1 }
      if (ja) {
        zeigen.add(p.id)
        if (p.eltern) zeigen.add(p.eltern)
      }
    })

    const sichtbar = alle.filter((p) => zeigen.has(p.id))
    const platzImZweig = {}
    sichtbar.forEach((p) => {
      const schlange = geschwister(p)
      platzImZweig[p.id] = { n: schlange.length, i: schlange.findIndex((q) => q.id === p.id) }
    })

    // Themen als Zwischenueberschriften — dieselbe Form wie die Phasen in den
    // Raeumen. Gezaehlt wird, was im Thema noch offen ist, Unterpunkte mit.
    const mitThemen = themenVon(liste).length > 0
    const offenImThema = {}
    if (mitThemen) {
      alle.forEach((p) => {
        const kopf = p.eltern ? allePunkte()[p.eltern] : p
        const t = kopf ? themaVon(kopf) : WEITERE
        if (status(p.id) !== 'fertig') offenImThema[t] = (offenImThema[t] || 0) + 1
      })
    }
    let letztesThema
    const teile = []
    sichtbar.forEach((p) => {
      if (mitThemen && !p.eltern) {
        const t = themaVon(p)
        if (t !== letztesThema) {
          const n = offenImThema[t] || 0
          teile.push(`<div class="phase"><span>${esc(themaName(liste, t))}</span><em>${n ? n + ' offen' : 'alles erledigt'}</em></div>`)
          letztesThema = t
        }
      }
      teile.push(zeichnePunkt(p, platzImZweig[p.id].n, platzImZweig[p.id].i))
    })

    const zeilen = teile.length
      ? teile.join('')
      : '<div class="leer">In dieser Ansicht ist hier gerade nichts.</div>'

    const themaWahl = mitThemen
      ? `<select class="p-feld p-thema" name="thema" aria-label="Thema für den neuen Punkt">
           ${themaReihe(liste).map((t) => `<option value="${t}"${t === WEITERE ? ' selected' : ''}>${esc(themaName(liste, t))}</option>`).join('')}
         </select>`
      : ''

    const klappe = (versteckt || (fertigeZeigen && b.fertig && ansicht !== 'fertig'))
      ? `<button class="ausklapp" type="button" data-fertige="${liste}" aria-expanded="${fertigeZeigen}">
           ${fertigeZeigen ? 'Erledigte wieder ausblenden' : `${versteckt} Erledigte${versteckt === 1 ? 's' : ''} einblenden`}
         </button>`
      : ''

    return `
      <section class="karte" style="--kante:${angabe.farbe}">
        <div class="karte-kopf">
          <h2>${esc(angabe.name)}</h2>
          <span class="meta">${b.fertig}/${b.gesamt} erledigt</span>
        </div>
        ${zeilen}
        ${klappe}
        <form class="p-anlegen" data-anlegen="${liste}">
          <div class="p-form">
            <input class="p-feld" name="text" maxlength="200" placeholder="Noch ein Punkt …"
                   aria-label="Neuer Punkt in ${esc(angabe.name)}">
            ${themaWahl}
            <button class="p-knopf" type="submit">Hinzufügen</button>
          </div>
          <span class="p-hinweis">Unterpunkte, Umbenennen und Löschen stehen im Detail jeder Zeile.</span>
        </form>
      </section>`
  }

  function zeichneEinkauf() {
    const noetig = MATERIAL.filter((m) => !m.wenn || stand.entscheidungen[m.wenn] === 'ja')
    const offen = noetig.filter((m) => !daIstEs(m.id)).length
    return `
      <section class="karte" style="--kante:var(--akzent)">
        <div class="karte-kopf">
          <h2>Einkaufsliste</h2>
          <span class="meta">${offen ? offen + ' von ' + noetig.length + ' fehlen' : 'alles da'}</span>
        </div>
        <div class="einkauf-liste">
          ${noetig.map((m) => `
            <button class="einkauf-zeile${daIstEs(m.id) ? ' da' : ''}" type="button" data-einkauf="${m.id}" aria-pressed="${daIstEs(m.id)}">
              <span class="status" data-s="${daIstEs(m.id) ? 'fertig' : 'offen'}" aria-hidden="true" style="pointer-events:none">${daIstEs(m.id) ? HAKEN : ''}</span>
              <span><span class="e-name">${esc(m.name)}</span><span class="e-wofuer">für ${esc(m.wofuer)}</span></span>
            </button>`).join('')}
        </div>
      </section>`
  }

  function zeichneWohnzimmer() {
    return `
      <section class="karte" style="--kante:var(--raum-wz)">
        <div class="karte-kopf"><h2>Wohnzimmer</h2><span class="meta">geparkt</span></div>
        <div class="parken">
          <p>Kommt später dran. Was euch bis dahin auffällt, kann hier stehen — dann muss es niemand neu zusammensuchen, wenn der Raum an der Reihe ist.</p>
          <textarea class="notiz" id="wz-notiz" placeholder="Vorhänge? Regal umstellen? Fenster …">${esc(stand.wohnzimmer || '')}</textarea>
        </div>
      </section>`
  }

  // Wer die Seite aufmacht, will nicht 36 Zeilen lesen, sondern wissen, was
  // jetzt dran ist. Drei Vorschlaege, gross genug zum Antippen.
  function zeichneNaechstes() {
    if (ansicht !== 'alle' || bereichFilter) return ''
    const schlange = warteschlange().slice(0, 3)
    if (!schlange.length) return ''
    return `
      <section class="naechstes">
        <h2>Als Nächstes</h2>
        <div class="naechstes-liste">
          ${schlange.map((a) => {
            const raum = RAUM_NACH_ID[a.raum]
            const wer = stand.wer[a.id]
            return `
            <button class="naechstes-karte" type="button" data-losgehen="${a.id}" style="--kante:${raum.farbe}">
              <span class="n-raum">${esc(raum.name)}</span>
              <span class="n-titel">${esc(a.t)}</span>
              <span class="n-fuss">${zeit(a.min)}${wer === 0 || wer === 1 ? ' · ' + esc(stand.namen[wer]) : ''}</span>
            </button>`
          }).join('')}
        </div>
      </section>`
  }

  function zeichneVerbinden() {
    if (!teilbar()) return ''
    if (wolke) {
      const andere = wolke.wer === 'Steffi' ? 'Maris' : 'Steffi'
      return `<div class="wolke verbunden">
        <div class="wolke-zeile">
          <span class="wolke-punkt"></span>
          <span>Geteilter Stand an, als <strong>${esc(wolke.wer)}</strong>.
            ${esc(andere)} sieht dieselben Haken.</span>
          <button class="knopf-still" type="button" id="trennen">Trennen</button>
        </div>
        <div class="wolke-zeile push">
          ${pushMoeglich()
            ? pushAn
              ? `<span class="wolke-punkt"></span>
                 <span>Benachrichtigungen an — du wirst gerufen, wenn ${esc(andere)} dir etwas zuteilt.</span>
                 <button class="knopf-still" type="button" id="push-aus">Aus</button>`
              : `<span>Benachrichtigt werden, wenn ${esc(andere)} dir eine Aufgabe zuteilt?</span>
                 <button class="knopf klein stark" type="button" id="push-an">Einschalten</button>`
            : amHandy()
              ? `<span class="wolke-hinweis">Für Benachrichtigungen auf dem iPhone: <strong>Teilen → Zum Home-Bildschirm</strong>,
                 dann die Seite von dort öffnen. Apple gibt sie einem offenen Tab nicht — in keinem Browser.</span>`
              : `<span class="wolke-hinweis">Dieser Browser kann keine Benachrichtigungen.</span>`}
          ${pushHinweis ? `<span class="wolke-fehler" role="alert">${esc(pushHinweis)}</span>` : ''}
        </div>
      </div>`
    }
    return `<form class="wolke" id="verbinden-form">
      <div class="wolke-text">
        <strong>Gemeinsam planen</strong>
        <span>Einmal verbinden, dann sehen Steffi und Maris dieselben Haken — auf beiden Handys.
          Dasselbe Passwort wie für die Seite.</span>
      </div>
      <div class="wolke-felder">
        <label class="wolke-wer">
          <span class="sr">Wer bist du?</span>
          <select id="verbinden-wer">
            <option value="Steffi">Steffi</option>
            <option value="Maris">Maris</option>
          </select>
        </label>
        <input type="password" id="verbinden-pw" placeholder="Passwort" autocomplete="current-password" required>
        <button class="knopf stark" type="submit">Verbinden</button>
      </div>
      ${wolkeFehler ? `<p class="wolke-fehler" role="alert">${esc(wolkeFehler)}</p>` : ''}
    </form>`
  }

  function blickPlan() {
    // "Jetzt dran" laesst die Listen aus: Punkte haben keine Vorgaenger und kein
    // Material, sie waeren alle dran und wuerden die Ansicht zuschuetten.
    const listen = ansicht === 'dran' ? ''
      : LISTEN.filter((l) => !bereichFilter || l === bereichFilter).map(zeichneListe).join('')
    return zeichneVerbinden() + zeichneUebersicht() + zeichneNaechstes() + zeichneFilter() +
      RAEUME.filter((r) => !bereichFilter || r.id === bereichFilter).map(zeichneRaum).join('') +
      listen +
      (IST_LISTE(bereichFilter) ? '' : zeichneEinkauf()) +
      (bereichFilter ? '' : zeichneWohnzimmer())
  }

  /* ----------------------------------------------------------- Fokus-Ansicht */

  function blickFokus() {
    const schlange = warteschlange()
    if (!schlange.length) {
      const wartend = AUFGABEN.filter((a) => aktiv(a) && status(a.id) !== 'fertig')
      return `<section class="fokus-karte"><div class="fokus-leer">
        ${wartend.length
          ? `<p><strong>Gerade ist nichts dran.</strong></p><p>Alle ${wartend.length} offenen Aufgaben warten auf einen Vorgänger oder auf Material. Ein Blick in die Einkaufsliste oder in den Ablauf zeigt, was den Stau löst.</p>`
          : `<p><strong>Beide Räume sind fertig.</strong></p><p>Nichts mehr zu tun — außer das Wohnzimmer aufzunehmen.</p>`}
      </div></section>`
    }

    const l = stand.laufend
    const jetzt = (l && AUFGABE_NACH_ID[l.id] && istDran(AUFGABE_NACH_ID[l.id])) ? AUFGABE_NACH_ID[l.id] : schlange[0]
    const raum = RAUM_NACH_ID[jetzt.raum]
    const laeuft = !!(l && l.id === jetzt.id)
    const sek = gelaufen(jetzt.id)
    const drueber = jetzt.min && sek > jetzt.min * 60

    const rest = schlange.filter((a) => a.id !== jetzt.id).slice(0, 4)

    return `
      <section class="fokus-karte" style="--kante:${raum.farbe}">
        <div class="fokus-innen">
          <span class="fokus-raum">${esc(raum.name)} · ${esc(jetzt.phase)}</span>
          <h2 class="fokus-titel">${esc(jetzt.t)}</h2>
          <div class="uhr${laeuft ? ' laeuft' : ''}${drueber ? ' drueber' : ''}">
            <span id="uhrwerk">${uhrzeit(sek)}</span>
            <span class="schaetzung">${jetzt.min ? 'geschätzt ' + zeit(jetzt.min) : ''}${drueber ? ' · drüber' : ''}</span>
          </div>
          ${jetzt.text ? `<p style="margin:0;color:var(--text-2);max-width:44rem">${esc(jetzt.text)}</p>` : ''}
          <div class="fokus-knoepfe">
            <button class="knopf ${laeuft ? '' : 'stark'}" type="button" data-uhr="${jetzt.id}">${laeuft ? 'Pause' : sek ? 'Weiter' : 'Los'}</button>
            <button class="knopf fertig" type="button" data-erledigt="${jetzt.id}">Fertig</button>
            <button class="knopf" type="button" data-ueberspringen="${jetzt.id}">Anderes nehmen</button>
          </div>
        </div>
        ${rest.length ? `<div class="warteschlange">
          ${rest.map((a, i) => `
            <button class="warte-zeile" type="button" data-losgehen="${a.id}">
              <span class="warte-nr">${i + 2}</span>
              <span class="w-titel">${esc(a.t)}</span>
              <span class="tag">${zeit(a.min)}</span>
            </button>`).join('')}
        </div>` : ''}
      </section>`
  }

  /* ---------------------------------------------------------- Ablauf-Ansicht */

  // Stufe = laengster Weg durch die Vorgaenger. Daraus werden die Spalten:
  // links, was sofort geht, rechts, was am Ende der Kette haengt.
  function stufen(raumId) {
    const menge = AUFGABEN.filter((a) => a.raum === raumId && aktiv(a))
    const tiefe = {}
    const rechne = (a, pfad) => {
      if (tiefe[a.id] != null) return tiefe[a.id]
      if (pfad.has(a.id)) return 0
      pfad.add(a.id)
      const vorher = (a.nach || []).map((id) => AUFGABE_NACH_ID[id]).filter((v) => v && aktiv(v))
      const d = vorher.length ? 1 + Math.max(...vorher.map((v) => rechne(v, pfad))) : 0
      pfad.delete(a.id)
      tiefe[a.id] = d
      return d
    }
    menge.forEach((a) => rechne(a, new Set()))
    const spalten = []
    menge.forEach((a) => {
      const d = tiefe[a.id]
      ;(spalten[d] = spalten[d] || []).push(a)
    })
    // Array.from schliesst Luecken: eine unbesetzte Stufe wuerde sonst als
    // Loch durch map() rutschen und Math.max auf NaN schicken.
    return Array.from(spalten, (s) => s || [])
  }

  function blickAblauf() {
    const spalten = stufen(ablaufRaum)
    const raum = RAUM_NACH_ID[ablaufRaum]
    const SB = 164, SL = 44, KH = 42, KA = 12, OBEN = 34

    const platz = {}
    spalten.forEach((spalte, x) => {
      spalte.forEach((a, y) => { platz[a.id] = { x: x * (SB + SL), y: OBEN + y * (KH + KA) } })
    })

    const hoehe = OBEN + Math.max(1, ...spalten.map((s) => s.length)) * (KH + KA) + 12
    const breite = spalten.length * (SB + SL) - SL + 4

    const kanten = []
    spalten.flat().forEach((a) => {
      (a.nach || []).forEach((id) => {
        const von = platz[id]
        const bis = platz[a.id]
        if (!von || !bis) return
        const x1 = von.x + SB, y1 = von.y + KH / 2
        const x2 = bis.x, y2 = bis.y + KH / 2
        const m = (x1 + x2) / 2
        kanten.push(`<path class="kante-linie${status(id) === 'fertig' ? ' erfuellt' : ''}" d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}"></path>`)
      })
    })

    const knoten = spalten.flat().map((a) => {
      const p = platz[a.id]
      const s = status(a.id)
      const fuellung = s === 'fertig' ? 'var(--gut-weich)' : s === 'laeuft' ? 'var(--warn-weich)' : 'var(--flaeche-2)'
      const rand = s === 'fertig' ? 'var(--gut)' : s === 'laeuft' ? 'var(--warn)' : istDran(a) ? 'var(--akzent)' : 'var(--fuge-stark)'
      const kurz = a.t.length > 23 ? a.t.slice(0, 22).trimEnd() + '…' : a.t
      return `<g class="knoten ${s}" data-status="${a.id}" transform="translate(${p.x} ${p.y})" role="button" tabindex="0"
                 aria-label="${esc(a.t)} — ${s}">
        <title>${esc(a.t)} · ${zeit(a.min)}</title>
        <rect width="${SB}" height="${KH}" rx="4" fill="${fuellung}" stroke="${rand}" stroke-width="1.4"
              ${istDran(a) && s === 'offen' ? 'stroke-dasharray="5 3"' : ''}></rect>
        <text x="11" y="${KH / 2}">${esc(kurz)}</text>
      </g>`
    })

    const titel = spalten.map((s, x) =>
      `<text class="stufe-titel" x="${x * (SB + SL)}" y="16">Stufe ${x + 1}</text>`).join('')

    return `
      <section class="karte" style="--kante:${raum.farbe}">
        <div class="karte-kopf">
          <h2>Ablauf</h2>
          <span class="meta">was welche Aufgabe freigibt — tippen schaltet den Status</span>
        </div>
        <div class="filter" style="position:static;padding:10px 16px;background:var(--flaeche)">
          ${RAEUME.map((r) => `<button class="chip" type="button" data-ablauf="${r.id}" aria-pressed="${ablaufRaum === r.id}">${esc(r.name)}</button>`).join('')}
        </div>
        <div class="ablauf-huelle">
          <svg width="${breite + 32}" height="${hoehe}" viewBox="0 0 ${breite + 32} ${hoehe}" style="min-width:${breite + 32}px">
            <g transform="translate(16 0)">${titel}${kanten.join('')}${knoten.join('')}</g>
          </svg>
        </div>
      </section>`
  }

  /* ---------------------------------------------------------------- Meldung */

  function melde(text, zurueck) {
    const alt = document.querySelector('.meldung')
    if (alt) alt.remove()
    clearTimeout(meldungTimer)
    rueckgaengig = zurueck || null

    const el = document.createElement('div')
    el.className = 'meldung'
    el.setAttribute('role', 'status')
    const span = document.createElement('span')
    span.textContent = text
    el.appendChild(span)
    if (zurueck) {
      const b = document.createElement('button')
      b.type = 'button'
      b.textContent = 'Rückgängig'
      b.dataset.zurueck = '1'
      el.appendChild(b)
    }
    document.body.appendChild(el)
    meldungTimer = setTimeout(() => { el.remove(); rueckgaengig = null }, 7000)
  }

  /* --------------------------------------------------------------- Konfetti */

  function konfetti(farbe) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
    const leinwand = document.getElementById('konfetti')
    const ctx = leinwand.getContext('2d')
    const dpr = window.devicePixelRatio || 1
    leinwand.width = innerWidth * dpr
    leinwand.height = innerHeight * dpr
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

    const farben = [farbe, '#2f7d3a', '#eda100', '#e87ba4', '#2a78d6']
    const stuecke = Array.from({ length: 90 }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: innerHeight * 0.42,
      vx: (Math.random() - 0.5) * 11,
      vy: -7 - Math.random() * 9,
      w: 5 + Math.random() * 6,
      h: 3 + Math.random() * 5,
      dreh: Math.random() * Math.PI,
      dv: (Math.random() - 0.5) * 0.28,
      f: farben[(Math.random() * farben.length) | 0],
    }))

    const start = performance.now()
    function schritt(t) {
      const alter = t - start
      ctx.clearRect(0, 0, innerWidth, innerHeight)
      if (alter > 2600) { ctx.clearRect(0, 0, innerWidth, innerHeight); return }
      stuecke.forEach((s) => {
        s.vy += 0.26
        s.x += s.vx
        s.y += s.vy
        s.dreh += s.dv
        ctx.save()
        ctx.translate(s.x, s.y)
        ctx.rotate(s.dreh)
        ctx.globalAlpha = Math.max(0, 1 - alter / 2600)
        ctx.fillStyle = s.f
        ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h)
        ctx.restore()
      })
      requestAnimationFrame(schritt)
    }
    requestAnimationFrame(schritt)
  }

  /* ------------------------------------------------------------ Zeichnen */

  function zeichne() {
    // Aufgeraeumt, bevor gezeichnet wird: diese Mengen halten Ids, und ein
    // Punkt kann auf dem anderen Geraet geloescht worden sein.
    if (offenerWer && !AUFGABE_NACH_ID[offenerWer] && !punktNachId(offenerWer)) offenerWer = null
    if (umbenennen && !punktNachId(umbenennen)) umbenennen = null

    zeichneKopf()
    const buehne = document.getElementById('buehne')
    buehne.innerHTML = blick === 'fokus' ? blickFokus() : blick === 'ablauf' ? blickAblauf() : blickPlan()
    zeigeStand()
    nachzeichnen = false
  }

  // Fuer alles, was von aussen kommt: `buehne.innerHTML` wirft jedes Eingabefeld
  // samt Cursor weg. Der Abgleich alle 15 Sekunden darf niemandem beim Tippen
  // das Feld unter den Fingern wegziehen — er wartet, bis es verlassen wird.
  function zeichneSanft() {
    const f = document.activeElement
    const tippt = f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA')
    const buehne = document.getElementById('buehne')
    if (tippt && buehne && buehne.contains(f)) { nachzeichnen = true; return }
    zeichne()
  }

  document.addEventListener('focusout', () => {
    // Erst im naechsten Takt: sonst ist beim Wechsel von einem Feld ins
    // naechste kurz gar nichts fokussiert und die Seite baut sich mitten im
    // Wechsel neu auf.
    setTimeout(() => { if (nachzeichnen) zeichneSanft() }, 0)
  })

  /* --------------------------------------------------------------- Aktionen */


  /* ------------------------------------------------------- Punkte aendern */

  // Kurz halten: der Auslieferungs-Workflow lehnt 43 Zeichen aus [A-Za-z0-9_-]
  // in Anfuehrungszeichen ab — das waere der Verdacht auf einen privaten
  // VAPID-Schluessel in der Datei.
  const neuePunktId = () =>
    'p' + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36).padStart(3, '0')

  // Felder dazuschreiben, nie den ganzen Eintrag ersetzen: sonst nimmt ein
  // Verschieben die Umbenennung zurueck, die daneben schon drinsteht.
  function schreibePunkt(id, felder) {
    if (!stand.punkte || typeof stand.punkte !== 'object') stand.punkte = {}
    stand.punkte[id] = { ...(stand.punkte[id] || {}), ...felder }
  }

  function legePunkt(liste, elternId, text, thema) {
    const t = String(text || '').trim().slice(0, 200)
    if (!t) return null
    const id = neuePunktId()
    const felder = { t, liste, eltern: elternId || null }
    if (!elternId && themenVon(liste).length) felder.thema = thema || WEITERE
    // Ans Ende der eigenen Gruppe — bei Themen also ans Ende des Themas.
    const gruppe = elternId
      ? Object.values(allePunkte()).filter((q) => q.eltern === elternId).sort(ordnePunkte)
      : geschwister({ ...felder, id: null })
    const letzter = gruppe[gruppe.length - 1]
    felder.pos = (letzter ? letzter.pos || 0 : 0) + 1000
    schreibePunkt(id, felder)
    sichern()
    return id
  }

  // In ein anderes Thema umhaengen: dort ans Ende, damit der Punkt nicht
  // irgendwo mitten zwischen fremden Plaetzen landet.
  function themaSetzen(id, thema) {
    const p = punktNachId(id)
    if (!p || p.eltern || themaVon(p) === thema) return
    const ziel = geschwister({ ...p, thema, id: null })
    const letzter = ziel[ziel.length - 1]
    schreibePunkt(id, { thema, pos: (letzter ? letzter.pos || 0 : 0) + 1000 })
    sichern()
    zeichne()
  }

  function benennePunkt(id, text) {
    const p = punktNachId(id)
    const t = String(text || '').trim().slice(0, 200)
    if (!p || !t || t === p.t) return false
    schreibePunkt(id, { t })
    sichern()
    return true
  }

  function verschiebePunkt(id, richtung) {
    const p = punktNachId(id)
    if (!p) return
    const gruppe = geschwister(p)
    const i = gruppe.findIndex((q) => q.id === id)
    const ziel = i + (richtung === 'auf' ? -1 : 1)
    if (i < 0 || ziel < 0 || ziel >= gruppe.length) return

    // Zwischen die Nachbarn des Zielplatzes einsortieren, statt Plaetze zu
    // tauschen: so schreibt der Handgriff genau einen Eintrag.
    const ohne = gruppe.filter((q) => q.id !== id)
    const vor = ohne[ziel - 1]
    const nach = ohne[ziel]
    const a = vor ? (vor.pos || 0) : 0
    const b = nach ? (nach.pos || 0) : a + 2000
    const mitte = (a + b) / 2

    if (mitte > a && mitte < b) {
      schreibePunkt(id, { pos: mitte })
    } else {
      // Luecke erschoepft (nach etwa 50 Halbierungen an derselben Stelle).
      // Dann die ganze Gruppe neu nummerieren — selten, aber sonst bliebe der
      // Punkt fuer immer stehen.
      const folge = ohne.slice(0, ziel).concat([p], ohne.slice(ziel))
      folge.forEach((q, n) => schreibePunkt(q.id, { pos: (n + 1) * 1000 }))
    }
    sichern()
    zeichne()
  }

  function loeschePunkt(id) {
    const p = punktNachId(id)
    if (!p) return
    const kinder = Object.values(allePunkte()).filter((q) => q.eltern === id).map((q) => q.id)
    const betroffen = [id].concat(kinder)

    const vorher = betroffen.map((x) => ({
      id: x,
      ab: stand.punkte && stand.punkte[x] ? { ...stand.punkte[x] } : null,
      notiz: stand.notizen[x],
    }))

    betroffen.forEach((x) => {
      // Grabstein statt Schluessel loeschen: verschmelzend ist ein fehlender
      // Schluessel nicht von "nicht geaendert" zu unterscheiden — der Punkt kaeme
      // beim naechsten Speichern des anderen Geraets zurueck.
      schreibePunkt(x, { weg: 1, wann: Date.now() })
      // Die Notiz muss mit ins Grab, sonst bleibt ihr Text unsterblich im Stand.
      if (stand.notizen[x]) stand.notizen[x] = ''
    })
    if (umbenennen && betroffen.indexOf(umbenennen) >= 0) umbenennen = null
    sichern()
    zeichne()

    melde(
      kinder.length
        ? `Gelöscht, mit ${kinder.length} Unterpunkt${kinder.length === 1 ? '' : 'en'}.`
        : 'Gelöscht.',
      () => {
        vorher.forEach((v) => {
          // Ausdrueckliches weg: 0 statt den Eintrag zu entfernen — aus demselben
          // Grund wie oben.
          stand.punkte[v.id] = v.ab || { weg: 0 }
          if (v.notiz) stand.notizen[v.id] = v.notiz
        })
        sichern()
        zeichne()
      },
    )
  }

  function setzeStatus(id, neu, alt) {
    stand.status[id] = neu
    if (neu === 'fertig') {
      if (stand.laufend && stand.laufend.id === id) halte()
      const vorher = alt === 'fertig'
      // Aufgabe oder Listenpunkt? Ein Punkt steht nicht in AUFGABE_NACH_ID —
      // ohne diese Weiche waere jeder Haken in den Listen ein TypeError.
      const a = AUFGABE_NACH_ID[id]
      if (a) {
        const b = bilanz(a.raum)
        if (!vorher && b.gesamt && b.fertig === b.gesamt) {
          konfetti(RAUM_NACH_ID[a.raum].jubel)
          melde(RAUM_NACH_ID[a.raum].name + ' ist durch.')
        }
      } else {
        const p = punktNachId(id)
        if (p) {
          punkteNeu()
          const b = listeBilanz(p.liste)
          if (!vorher && b.gesamt && b.fertig === b.gesamt) {
            konfetti(SAAT[p.liste].jubel)
            melde(SAAT[p.liste].name + ' ist abgearbeitet.')
          }
        }
      }
    }
    sichern()
  }

  function erledige(id) {
    const alt = status(id)
    if (stand.laufend && stand.laufend.id === id) halte()
    const gebraucht = stand.ist[id]
    setzeStatus(id, 'fertig', alt)
    zeichne()
    melde(
      'Erledigt' + (gebraucht ? ' in ' + uhrzeit(gebraucht) : '') + '.',
      () => { stand.status[id] = alt; sichern(); zeichne() },
    )
  }

  document.addEventListener('click', (ev) => {
    const ziel = ev.target.closest(
      '[data-status],[data-detail],[data-ansicht],[data-bereich],[data-einkauf],[data-entscheidung],[data-blick],[data-wer],[data-wer-wahl],[data-uhr],[data-erledigt],[data-ueberspringen],[data-losgehen],[data-ablauf],[data-zurueck],[data-fertige],[data-p-name],[data-p-auf],[data-p-ab],[data-p-kind],[data-p-weg],[data-umbenennen-ab],#zuruecksetzen,#trennen,#push-an,#push-aus',
    )
    if (!ziel) return

    if (ziel.dataset.zurueck) {
      if (rueckgaengig) rueckgaengig()
      const m = document.querySelector('.meldung')
      if (m) m.remove()
      rueckgaengig = null
      return
    }

    if (ziel.dataset.blick) { blick = ziel.dataset.blick; return zeichne() }
    if (ziel.dataset.ablauf) { ablaufRaum = ziel.dataset.ablauf; return zeichne() }

    if (ziel.dataset.status) {
      // Ein Kaestchen, zwei Zustaende: angetippt heisst erledigt, nochmal
      // angetippt nimmt es zurueck. "Laeuft" entsteht nur, wenn wirklich eine
      // Uhr laeuft — ein Dreier-Zyklus im Kaestchen hat niemand erraten.
      //
      // Abgehaktes klappt sofort aus der Liste. Deshalb geht es hier ueber
      // erledige(): das zeigt die Rueckgaengig-Meldung. Ohne sie waere ein
      // Fehlgriff nicht zurueckzunehmen — das Kaestchen ist ja verschwunden.
      const id = ziel.dataset.status
      if (status(id) === 'fertig') {
        stand.status[id] = 'offen'
        sichern()
        return zeichne()
      }
      return erledige(id)
    }

    if (ziel.dataset.wer) {
      // Aufklappen statt durchklicken: wer zuteilt, will einen Namen waehlen,
      // nicht raten, beim wievielten Tipp der richtige kommt.
      offenerWer = offenerWer === ziel.dataset.wer ? null : ziel.dataset.wer
      return zeichne()
    }

    if (ziel.dataset.werWahl) {
      const id = ziel.dataset.werWahl
      const wahl = ziel.dataset.person
      // Ausdrueckliches null statt Schluessel loeschen: beim Verschmelzen auf
      // dem Server ist ein fehlender Schluessel nicht von "nicht geaendert" zu
      // unterscheiden, ein null schon.
      const vorher = stand.wer[id]
      stand.wer[id] = wahl === 'keiner' ? null : Number(wahl)
      offenerWer = null
      sichern()
      zeichne()
      const was = AUFGABE_NACH_ID[id] || punktNachId(id)
      if (was && stand.wer[id] != null && stand.wer[id] !== vorher) {
        meldeZuteilung(was, stand.wer[id])
      }
      return
    }

    if (ziel.dataset.uhr) {
      const id = ziel.dataset.uhr
      if (stand.laufend && stand.laufend.id === id) halte()
      else starte(id)
      return zeichne()
    }

    if (ziel.dataset.erledigt) return erledige(ziel.dataset.erledigt)

    if (ziel.dataset.ueberspringen) {
      const id = ziel.dataset.ueberspringen
      if (stand.laufend && stand.laufend.id === id) halte()
      const schlange = warteschlange()
      const naechste = schlange.find((a) => a.id !== id)
      if (naechste) { stand.laufend = { id: naechste.id, seit: Date.now() }; sichern() }
      return zeichne()
    }

    if (ziel.dataset.losgehen) {
      starte(ziel.dataset.losgehen)
      blick = 'fokus'
      return zeichne()
    }

    if (ziel.dataset.detail) {
      const id = ziel.dataset.detail
      if (offeneDetails.has(id)) offeneDetails.delete(id)
      else offeneDetails.add(id)
      return zeichne()
    }

    if (ziel.dataset.fertige) {
      const id = ziel.dataset.fertige
      if (offeneFertige.has(id)) offeneFertige.delete(id)
      else offeneFertige.add(id)
      return zeichne()
    }

    if (ziel.dataset.pName) {
      umbenennen = ziel.dataset.pName
      neuesKind = null
      zeichne()
      const feld = document.querySelector('[data-umbenennen="' + umbenennen + '"] .p-feld')
      if (feld) { feld.focus(); feld.select() }
      return
    }

    if (ziel.dataset.umbenennenAb) { umbenennen = null; return zeichne() }

    if (ziel.dataset.pKind) {
      neuesKind = neuesKind === ziel.dataset.pKind ? null : ziel.dataset.pKind
      umbenennen = null
      zeichne()
      const feld = document.querySelector('[data-anlegen-kind="' + ziel.dataset.pKind + '"] .p-feld')
      if (feld) feld.focus()
      return
    }

    if (ziel.dataset.pAuf) return verschiebePunkt(ziel.dataset.pAuf, 'auf')
    if (ziel.dataset.pAb) return verschiebePunkt(ziel.dataset.pAb, 'ab')

    if (ziel.dataset.pWeg) {
      const p = punktNachId(ziel.dataset.pWeg)
      const kinder = p ? Object.values(allePunkte()).filter((q) => q.eltern === p.id).length : 0
      // Gefragt wird nur, wenn Unterpunkte mitgehen. Fuer eine einzelne Zeile
      // reicht die Rueckgaengig-Meldung — eine Abfrage je Zeile waere bei
      // neunzig Punkten eine Zumutung.
      if (kinder && !confirm(`„${p.t}“ mit ${kinder} Unterpunkt${kinder === 1 ? '' : 'en'} löschen?`)) return
      return loeschePunkt(ziel.dataset.pWeg)
    }

    if (ziel.dataset.ansicht) { ansicht = ziel.dataset.ansicht; return zeichne() }

    if (ziel.dataset.bereich) {
      bereichFilter = bereichFilter === ziel.dataset.bereich ? null : ziel.dataset.bereich
      return zeichne()
    }

    if (ziel.dataset.einkauf) {
      const id = ziel.dataset.einkauf
      stand.einkauf[id] = !stand.einkauf[id]
      sichern()
      return zeichne()
    }

    if (ziel.dataset.entscheidung) {
      const id = ziel.dataset.entscheidung
      const wahl = ziel.dataset.wahl
      stand.entscheidungen[id] = stand.entscheidungen[id] === wahl ? 'offen' : wahl
      sichern()
      return zeichne()
    }

    if (ziel.id === 'push-an') { pushEinschalten(); return }
    if (ziel.id === 'push-aus') { pushAusschalten(); return }

    if (ziel.id === 'trennen') {
      if (!confirm('Dieses Gerät abmelden. Der gemeinsame Stand bleibt erhalten — beim nächsten Öffnen fragt die Seite wieder nach dem Passwort.')) return
      abmelden()
      return
    }

    if (ziel.id === 'zuruecksetzen') {
      if (!confirm('Alle Haken, Zeiten, Notizen und die Einkaufsliste zurücksetzen? Die Punkte in ToDo Garten und ToDo Haus bleiben stehen.')) return
      const alt = stand
      stand = leer()
      stand.namen = alt.namen
      // Die Listen sind Inhalt, keine Haken — ein Fehlgriff auf diesen Knopf
      // darf nicht neunzig Punkte mitnehmen.
      stand.punkte = alt.punkte
      const zurueck = () => { stand = alt; punkteNeu(); sichern(); ersetzenFern(); zeichne() }
      sichern()
      ersetzenFern()
      zeichne()
      melde('Alles zurückgesetzt.', zurueck)
    }
  })

  document.addEventListener('submit', (ev) => {
    const form = ev.target

    if (form.id === 'verbinden-form') {
      ev.preventDefault()
      const pw = document.getElementById('verbinden-pw')
      const wer = document.getElementById('verbinden-wer')
      if (!pw.value) return
      anmelden(pw.value, wer.value)
      pw.value = ''
      return
    }

    // Anlegen, Unterpunkt und Umbenennen sind Formulare, damit die
    // Eingabetaste tut, was sie soll — am Handy steht dort dann "Fertig".
    if (form.dataset.anlegen) {
      ev.preventDefault()
      const feld = form.querySelector('input.p-feld')
      const wahl = form.querySelector('select.p-thema')
      const id = legePunkt(form.dataset.anlegen, null, feld.value, wahl ? wahl.value : undefined)
      if (!id) return
      zeichne()
      // Nach dem Neuzeichnen steht ein anderes Feld da — den Fokus
      // zurueckgeben, damit man mehrere Punkte hintereinander eintippen kann.
      const neu = document.querySelector('[data-anlegen="' + form.dataset.anlegen + '"] input.p-feld')
      if (neu) neu.focus()
      // Das gewaehlte Thema stehen lassen: wer drei Kinder-Sachen nacheinander
      // eintippt, will nicht dreimal "Kinder" auswaehlen.
      const neueWahl = document.querySelector('[data-anlegen="' + form.dataset.anlegen + '"] select.p-thema')
      if (neueWahl && wahl) neueWahl.value = wahl.value
      return
    }

    if (form.dataset.anlegenKind) {
      ev.preventDefault()
      const eltern = form.dataset.anlegenKind
      const feld = form.querySelector('.p-feld')
      const id = legePunkt(punktNachId(eltern).liste, eltern, feld.value)
      if (!id) return
      offeneDetails.add(eltern)
      zeichne()
      const neu = document.querySelector('[data-anlegen-kind="' + eltern + '"] .p-feld')
      if (neu) neu.focus()
      return
    }

    if (form.dataset.umbenennen) {
      ev.preventDefault()
      const feld = form.querySelector('.p-feld')
      benennePunkt(form.dataset.umbenennen, feld.value)
      umbenennen = null
      return zeichne()
    }
  })

  document.addEventListener('input', (ev) => {
    const el = ev.target
    if (el.dataset && el.dataset.notiz) { stand.notizen[el.dataset.notiz] = el.value; sichern() }
    else if (el.id === 'wz-notiz') { stand.wohnzimmer = el.value; sichern() }
    else if (el.id === 'name-0' || el.id === 'name-1') {
      stand.namen[el.id === 'name-0' ? 0 : 1] = el.value
      sichern()
    }
  })

  // Namensfelder erst beim Verlassen neu zeichnen, sonst springt der Cursor
  // bei jedem Tastendruck.
  document.addEventListener('change', (ev) => {
    if (ev.target.dataset && ev.target.dataset.pThema) {
      themaSetzen(ev.target.dataset.pThema, ev.target.value)
      return
    }
    if (ev.target.id === 'name-0' || ev.target.id === 'name-1') zeichne()
  })

  document.addEventListener('keydown', (ev) => {
    const t = ev.target
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return

    const k = ev.key.toLowerCase()
    if (k === 'p') { blick = 'plan'; zeichne() }
    else if (k === 'f') { blick = 'fokus'; zeichne() }
    else if (k === 'a') { blick = 'ablauf'; zeichne() }
    else if (blick === 'fokus') {
      const schlange = warteschlange()
      if (!schlange.length) return
      const l = stand.laufend
      const jetzt = (l && AUFGABE_NACH_ID[l.id] && istDran(AUFGABE_NACH_ID[l.id])) ? AUFGABE_NACH_ID[l.id] : schlange[0]
      if (ev.key === ' ') {
        ev.preventDefault()
        if (l && l.id === jetzt.id) halte()
        else starte(jetzt.id)
        zeichne()
      } else if (ev.key === 'Enter') {
        ev.preventDefault()
        erledige(jetzt.id)
      }
    }
  })

  // Der Ablaufgraph ist mit der Tastatur bedienbar: die Knoten sind fokussierbar.
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return
    const knoten = ev.target.closest && ev.target.closest('.knoten')
    if (!knoten) return
    ev.preventDefault()
    knoten.dispatchEvent(new MouseEvent('click', { bubbles: true }))
  })

  // Nur die Ziffern der Uhr aktualisieren, nicht die ganze Seite: ein
  // Neuaufbau pro Sekunde wuerde jede Eingabe und jeden Fokus zerstoeren.
  setInterval(() => {
    const l = stand.laufend
    if (!l || blick !== 'fokus') return
    const el = document.getElementById('uhrwerk')
    if (el) el.textContent = uhrzeit(gelaufen(l.id))
  }, 1000)

  zeichne()
})()
</script>
